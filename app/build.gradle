plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
}

// Firebase is enabled only when app/google-services.json is present (see README → Phone sign-up).
// Without it the app builds normally; debug builds fall back to a fake OTP provider.
if (file("google-services.json").exists()) {
    apply plugin: libs.plugins.google.services.get().pluginId
}

// Release signing is read from an untracked keystore.properties file (see README).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.app.winterarc'
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }

    defaultConfig {
        applicationId "com.app.winterarc"
        // java.time is used throughout for DST-safe date math; API 26 provides it natively.
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Each instrumented test starts from a clean install state.
        testInstrumentationRunnerArguments clearPackageData: "true"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                ]
            }
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            optimization {
                enable true
            }
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

dependencies {
    constraints {
        // Navigation resolves 1.7.3, but Room's schema (migration) tooling needs 1.8.x. Align both.
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-core:1.8.1")
        implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1")
    }
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.fragment
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.viewpager2
    implementation libs.androidx.core
    implementation libs.androidx.core.splashscreen
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.viewmodel.savedstate
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.work.runtime

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth

    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler
    implementation libs.androidx.hilt.work
    annotationProcessor libs.androidx.hilt.compiler

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.ext.junit
    testImplementation libs.arch.core.testing
    testImplementation libs.room.testing
    testImplementation libs.espresso.core

    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.room.testing
    androidTestImplementation libs.arch.core.testing
    androidTestUtil libs.test.orchestrator
    androidTestUtil libs.test.services
}
