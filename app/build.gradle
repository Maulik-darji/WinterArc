plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
}

// Supabase's publishable client values are read at build time. local.properties is ignored by
// Git; CI can provide the same names as environment variables.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def supabaseUrl = System.getenv("SUPABASE_URL") ?: localProperties.getProperty("SUPABASE_URL", "")
def supabasePublishableKey = System.getenv("SUPABASE_PUBLISHABLE_KEY") ?:
        localProperties.getProperty("SUPABASE_PUBLISHABLE_KEY", "")

// "Continue with Google" needs the OAuth *web* client id from Google Cloud (the same id is listed
// under Client IDs in Supabase > Authentication > Providers > Google). It is public, not a secret.
def googleWebClientId = System.getenv("GOOGLE_WEB_CLIENT_ID") ?: localProperties.getProperty("GOOGLE_WEB_CLIENT_ID", "")
// Instrumented tests must never create real accounts, so they build with the local test sign-in.
def instrumentedTestRun = gradle.startParameter.taskNames.any { it.toLowerCase().contains("androidtest") }

// Release signing is read from an untracked keystore.properties file (see README).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.app.winterarc'
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }

    defaultConfig {
        applicationId "com.app.winterarc"
        // java.time is used throughout for DST-safe date math; API 26 provides it natively.
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"${supabasePublishableKey}\""
        buildConfigField "boolean", "SUPABASE_CONFIGURED",
                "${!supabaseUrl.isBlank() && !supabasePublishableKey.isBlank()}"
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleWebClientId}\""
        buildConfigField "boolean", "USE_SUPABASE_AUTH", "${!instrumentedTestRun}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Each instrumented test starts from a clean install state.
        testInstrumentationRunnerArguments clearPackageData: "true"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                ]
            }
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            optimization {
                enable true
            }
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
}

